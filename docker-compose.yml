# 生产部署：docker compose up -d --build
# 内存按你那台 VPS（约 4G，还跑着别的服务）配的，三个容器加起来 ≈ 900M。

name: ideahub

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ideahub
      POSTGRES_USER: ideahub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      # 明确指定 locale，别让容器默认值决定行为
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=128MB -c max_connections=40
               -c work_mem=4MB -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideahub -d ideahub"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { memory: 512M }

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ideahub:${DB_PASSWORD}@db:5432/ideahub
      DB_DRIVER: pg
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=256
      BOT_WEBHOOK: ${BOT_WEBHOOK:-}
      # 智能导入只在服务端调用 OpenAI，密钥不会进入前端静态资源。
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # 页面里保存的兼容接口配置会加密后落到 IdeaHub 自己的独立持久卷。
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-}
      AI_PROVIDER_CONFIG_FILE: /var/lib/ideahub-ai/provider.json
      # 账号相关。注意这里是白名单式地一个个列出来的，
      # 所以 .env 里的 ALLOW_HEADER_AUTH 那个开发后门传不进容器 —— 这是故意的。
      SESSION_DAYS: ${SESSION_DAYS:-30}
      INVITE_CODE: ${INVITE_CODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    volumes:
      # 附件必须落在挂载卷上。存容器里的话 docker compose up --build 一重建就没了，
      # 而重建是这个项目改前端的日常操作。
      - ./data/uploads:/data/uploads
      - ai-provider:/var/lib/ideahub-ai
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 320M }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 端口做成可配的：服务器上要是已经跑着别的 caddy / nginx 占了 80，
    # 在 .env 里设 HTTP_PORT=8080 即可，不用去动人家已经在跑的服务。
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on: [api]
    deploy:
      resources:
        limits: { memory: 32M }

volumes:
  ai-provider:
